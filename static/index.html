<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .ai { align-self: flex-start; background: #e9e9eb; color: #333; }
        #input-area { padding: 20px 20px 2px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        #status { padding: 4px 20px 20px; background: white; font-size: 0.85em; color: #888; min-height: 1.2em; }
        #status.error { color: #c0392b; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="(Craft Demo for Intuit) Type your sales prediction question... (Hint: How's my top 3 sales by category for the next 3 months?)" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
    <div id="status"></div>

    <script>
      async function sendMessage() {
        const input = document.getElementById('userInput');
        const container = document.getElementById('chat-container');
        const status = document.getElementById('status');
        const text = input.value.trim();
        if (!text) return;

        // 1. Add User Message to UI
        container.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';
        status.textContent = 'Thinking...';

        // 2. Create AI Message placeholder
        const aiMsgDiv = document.createElement('div');
        aiMsgDiv.className = 'message ai';
        container.appendChild(aiMsgDiv);
        container.scrollTop = container.scrollHeight;

        // 3. Fetch stream using POST
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');
          
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.slice(6);
              if (dataStr === '[DONE]') break;
              try {
                const data = JSON.parse(dataStr);
                if (data.error) {
                  status.textContent = `Error: ${data.error}`;
                  status.classList.add('error');
                  aiMsgDiv.remove();
                } else {
                  if (data.content) status.textContent = 'Responding...';
                  aiMsgDiv.innerText += data.content;
                  container.scrollTop = container.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }
        if (!status.classList.contains('error')) status.textContent = '';
        status.classList.remove('error');
      }
    </script>
</body>
</html>
